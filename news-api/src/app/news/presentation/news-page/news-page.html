<section class="page">
   <header>
        <h1>News Api</h1>
        <p>Buscando noticias utilizando NewsApi</p>
    </header>
    <div class="search">
    <input 
    #queryInput
    type="text"
    [value]="query()"
    (input)="query.set(queryInput.value)"
    placeholder="Buscar noticias">

    <button
    type="button"
    (click)= "search()"
    >
     Buscar Noticias
    </button>
    </div> 
  <div class="articles">
   @for(article of store.articles(); track article.url){
      <article>
         @if(article.urlToImage){
            <img
             [src]="article.urlToImage"
             [alt]="article.title">
         }
         <h2>
            {{article.title}}
         </h2>
         <p>
            {{article.description}}
         </p>
         <a 
         [href]="article.url"
         target="_blank">
         Leer noticia
        </a>
      </article> 
   }
  </div>

</section>
